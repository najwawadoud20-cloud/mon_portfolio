<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mon Univers Mathémagique</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com" rel="stylesheet">
</head>
<body>

<div class="scene">
  <div id="book" class="book">
    <div id="p1" class="paper" style="z-index: 3;">
      <div class="front">
        <div class="cover-art">
          <div class="starry-bg"></div>
          <div class="ramadan-moon"></div>
          <div class="golden-dust"></div>
          <div class="title-group">
            <h1>Portfolio</h1>
            <div class="love-icon">♥</div>
            </div>
            <div class="signature">Ouadoud Najwa</div>
            </div>
            </div>
            <div class="back">
              <div class="content personal golden-ratio">
                <div class="photo-frame"><img src="https://img.freepik.com/free-photo/adorable-girl-being-passionate-about-robotics_23-2149106276.jpg?semt=ais_hybrid&w=740&q=80" alt="rêver"></div>
                <div class="text-frame"><p>Vibre mon esprit,<br>À la cadence du coeur<br>Mathémagique.</p></div>
                </div>
                </div>
                </div>

<div id="p2" class="paper" style="z-index: 2;">
  <div class="front">
    <div class="content personal golden-ratio reverse">
      <img src="https://www.poeticmind.co.uk/wp-content/uploads/2010/08/Paul-Hartal-The-Mathematician-2003.jpg" height="270" width="350" alt="Projet"<br>
      <div class="text-frame"><p>Chiffres innocents<br>Rigoureux et élégants<br>Espoir des savants!</p></div>
      </div>
      </div>
      
<div class="back">
  <div class="content calc-page">
    <div class="descartes-container">
      <div class="thought-bubble">Je pense, donc je calcule... ✨</div>
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQhOXLKpd8uPy7z3rOKBDeWEDOeCg0LHTQIo8KGjorT3Q&s=10" height="55" width="35" alt="Descartes" class="descartes-img">
      </div>
      
      <div class="calculator">
        <div id="display">0</div>
        <div class="keys">
          <button onclick="clearCalc()" class="btn-clear">C</button>
          <button onclick="append('/')">/</button>
          <button onclick="append('*')">×</button>
          <button onclick="append('-')">-</button>
        
          <button onclick="append('7')">7</button><button onclick="append('8')">8</button><button onclick="append('9')">9</button>
        <button onclick="append('+')">+</button>
        
        <button onclick="append('4')">4</button><button onclick="append('5')">5</button><button onclick="append('6')">6</button>
         <button onclick="calculate()" class="btn-equal">=</button>
         
         <button onclick="append('1')">1</button><button onclick="append('2')">2</button><button onclick="append('3')">3</button>
         <button onclick="append('0')">0</button>
         </div>
         </div>
         <div class="tools">📏 ✨ 📐</div>
         </div>
         </div>

<script src="script.js"></script>
</body>
  </html>
